<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동화 책장</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Gowun Batang', serif;
            background-color: #2b3a2b;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(60, 80, 58, 0.5) 0%, rgba(25, 36, 25, 0.95) 100%),
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0px, rgba(255, 255, 255, 0.03) 1px, transparent 1px, transparent 4px),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.03) 0px, rgba(255, 255, 255, 0.03) 1px, transparent 1px, transparent 4px);
            background-size: 100% 100%, 8px 8px, 8px 8px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .wood-shelf {
            background-color: #3d2314;
            background-image: 
                repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 8px),
                repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 2px, transparent 2px, transparent 12px),
                linear-gradient(135deg, #4a2c17 0%, #321c0e 50%, #4a2c17 100%);
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.6),
                inset 0 2px 5px rgba(255,255,255,0.2),
                inset 0 -5px 10px rgba(0,0,0,0.5);
            border: 10px solid #28160a;
            border-radius: 8px;
        }

        .shelf-tier {
            background-color: #2c180b;
            background-image: 
                repeating-linear-gradient(90deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 120px, rgba(0,0,0,0.3) 121px),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 6px),
                linear-gradient(180deg, #221208 0%, #361e0e 100%);
            box-shadow: 
                inset 0 10px 20px rgba(0,0,0,0.7),
                inset 10px 0 15px rgba(0,0,0,0.5),
                inset -10px 0 15px
